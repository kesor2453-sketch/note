<!doctype html>
<html lang="km">

<meta charset="utf-8">

<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#1b2a4a;--muted:#5b6780;--rule:#dbe2ee;--pen:#1f3f9e;--pen2:#2a4fc0;--soft:#e6ebf7;--ok:#16a34a;--warn:#b45309;--bad:#b42318;--r:14px}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Kantumruy Pro","Noto Sans Khmer",system-ui,sans-serif;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pen)}
.top{background:linear-gradient(135deg,#16244a,#1f3f9e);color:#fff;padding:18px 16px 54px}
.top .in{max-width:1100px;margin:0 auto;display:flex;gap:12px;align-items:center}
.logo{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:26px;flex:none}
.top h1{margin:0;font-size:20px;line-height:1.25}
.top .sub{font-size:13px;opacity:.85}
.top .sub a{color:#fff}
.wrap{max-width:1100px;margin:-38px auto 0;padding:0 16px}
.searchcard{background:var(--card);border-radius:var(--r);box-shadow:0 6px 24px rgba(16,30,70,.12);padding:12px}
.search{width:100%;border:1.5px solid var(--rule);border-radius:12px;padding:11px 14px;font-size:15px;background:#f8fafc}
.search:focus{outline:0;border-color:var(--pen);background:#fff}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px;color:var(--muted)}
.cats button[aria-pressed=true]{background:var(--pen);border-color:var(--pen);color:#fff}
.banner{margin:12px 0 0;background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:9px 12px;font-size:14px}
.closed{margin:12px 0 0;background:#fef2f2;border:1px solid #fecaca;color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,46%),1fr));gap:12px;margin:14px 0}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(16,30,70,.08);display:flex;flex-direction:column}

.ph img{width:100%;height:100%;object-fit:cover}
.ph .rx{position:absolute;top:8px;left:8px;background:#fff;color:var(--bad);border-radius:8px;padding:1px 7px;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.15)}

.cb{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px;flex:1}

.cb small{color:var(--muted);font-size:12px;line-height:1.35}
.price{font-weight:700;color:var(--pen);font-size:16px;margin-top:auto}

.left{font-size:11.5px;color:var(--ok)}

.step span{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.cartbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(238,242,247,.95) 30%);z-index:20}

.myo{display:block;margin:10px auto 0;border:0;background:none;color:var(--pen);font-weight:600;text-decoration:underline}

.grab{width:42px;height:4px;border-radius:4px;background:var(--rule);margin:6px auto 4px}

.x{border:1px solid var(--rule);background:#fff;border-radius:10px;width:36px;height:36px}

.line .step{margin:0;width:120px}
h3{font-size:15px;margin:16px 0 6px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--pen)}
.opt.on{border-color:var(--pen);background:var(--soft)}
.opt small{display:block;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:3px;margin:8px 0}
.f span{font-size:13px;color:var(--muted)}
.f input,.f textarea{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:#fff}

.tot .g{font-size:18px;font-weight:700;color:var(--pen)}

.foot{text-align:center;color:var(--muted);font-size:12px;margin:24px 0}

.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:9px 16px;z-index:60;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
</style>
</head>

  var fail=function(t){ er.className="gerr"; er.textContent="⚠ "+t; go.disabled=false; };
  go.onclick=function(){ var p=normPhone(ph.value), code=c1.value.trim(), name=nm?nm.value.trim():"";
    if(nm&&!name) return fail("សូមដាក់ឈ្មោះ"); if(!/^0\d{7,10}$/.test(p)) return fail("លេខទូរស័ព្ទមិនត្រឹមត្រូវ"); if(code.length<4) return fail("លេខសម្ងាត់យ៉ាងតិច ៤ តួ"); if(c2&&c2.value.trim()!==code) return fail("លេខសម្ងាត់ទាំងពីរមិនដូចគ្នា");
    go.disabled=true; er.textContent=""; var cref=shop.collection("customers").doc(p);
    cref.get().then(function(c){
      if(mode==="up"){ if(c.exists) return fail("លេខនេះបានចុះឈ្មោះរួចហើយ — សូមចូល ឬចុច «ភ្លេចលេខសម្ងាត់»");
        return cref.set({phone:p,ver:0,created:Date.now(),updated:Date.now()}).then(function(){ return accKey(p,code,0); }).then(function(k){
          return shop.collection("accounts").doc(k).set({phone:p,name:name.slice(0,80),ver:0,orders:[],created:Date.now(),updated:Date.now()}).then(function(){ done({phone:p,name:name.slice(0,80),key:k,ver:0},"✓ បានចុះឈ្មោះ"); }); }); }
      if(!c.exists) return fail("លេខនេះមិនទាន់ចុះឈ្មោះ — សូមចុច «ចុះឈ្មោះ»");
      var ver=c.data().ver||0;
      if(mode==="in") return accKey(p,code,ver).then(function(k){ return shop.collection("accounts").doc(k).get().then(function(a){ if(!a.exists) return fail("លេខសម្ងាត់មិនត្រឹមត្រូវ"); done({phone:p,name:a.data().name||"",key:k,ver:ver},"✓ បានចូល"); }); });
      /* forgot: new code with the phone number only (as the clinic chose) */
      var nv=ver+1, nmOld="";
      return cref.update({ver:nv,updated:Date.now()}).then(function(){ return accKey(p,code,nv); }).then(function(k){
        try{ var me=JSON.parse(localStorage.getItem(ME_KEY)||"{}"); if(normPhone(me.phone)===p) nmOld=me.name||""; }catch(e){}
        return shop.collection("accounts").doc(k).set({phone:p,name:(nmOld||"").slice(0,80),ver:nv,orders:[],created:Date.now(),updated:Date.now()}).then(function(){ done({phone:p,name:nmOld||p,key:k,ver:nv},"✓ បានរក្សាទុកលេខសម្ងាត់ថ្មី"); }); });
    }).catch(function(e){ fail("មិនអាចភ្ជាប់បាន ("+(e.code||e.message)+")"); }); };
  var done=function(s,t){ accSave(s); F.name=s.name; F.phone=s.phone; try{ localStorage.setItem(ME_KEY,JSON.stringify({name:s.name,phone:s.phone,address:F.address||""})); }catch(e){} g.hidden=true; toast(t); accLoad(); };
  [nm,ph,c1,c2].forEach(function(i){ if(i) i.onkeydown=function(e){ if(e.key==="Enter") go.click(); }; });
  bx.appendChild(er); bx.appendChild(go);
  if(mode==="in"){ var fg=mk("button","glink","ភ្លេចលេខសម្ងាត់? · Forgot code"); fg.type="button"; fg.onclick=function(){ gate("forgot"); }; bx.appendChild(fg); }
  if(mode==="forgot"){ var bk=mk("button","glink","‹ ត្រឡប់ទៅចូល · Back"); bk.type="button"; bk.onclick=function(){ gate("in"); }; bx.appendChild(bk); }
  setTimeout(function(){ (nm||ph).focus(); },50); }
try{ ACC.s=JSON.parse(localStorage.getItem(SESS_KEY)||"null"); }catch(e){}
if(!window.crypto||!crypto.subtle){ toast("Browser នេះមិនគាំទ្រការចូលគណនី"); } else if(ACC.s){ accMe(); F.name=F.name||ACC.s.name; accLoad(); } else gate("in");

})();
</script>
